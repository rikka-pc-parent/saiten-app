<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宿題プリント自動採点</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>宿題プリント自動採点</h1>
      </section>

      <section class="panel">
        <div id="subjectButtons" class="subject-buttons" aria-live="polite"></div>

        <div class="image-action-row">
          <button id="cameraButton" class="image-action-button primary" type="button">📷 カメラで撮る</button>
          <button id="galleryButton" class="image-action-button" type="button">🖼️ 写真を選ぶ</button>
        </div>
        <input id="imageInput" type="file" accept="image/*" capture="environment" />
        <input id="galleryInput" type="file" accept="image/*" />

        <div id="webcamPanel" class="webcam-panel hidden" aria-live="polite">
          <video id="cameraPreview" class="camera-preview" autoplay playsinline muted></video>
          <div class="webcam-actions">
            <button id="captureFromWebcam" class="capture-button" type="button">この画像を採用</button>
            <button id="closeWebcam" class="close-button" type="button">閉じる</button>
          </div>
        </div>

        <div id="previewWrap" class="preview-wrap hidden">
          <img id="previewImage" class="preview-image" alt="選択された画像のプレビュー" />
        </div>

        <button id="gradeButton" class="grade-button" type="button" disabled>採点する</button>
        <div id="status" class="status" aria-live="polite"></div>
      </section>

      <section class="panel result-box">
        <h2>採点結果</h2>
        <pre id="resultText">教科を選んで、プリントの写真を撮るか画像を選択してください。</pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
